<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crompton Homepage Redesign — Prototypes</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Poppins,system-ui,sans-serif;background:#05395f;color:#fff}

a.primary{background:#fff;color:#05395f}

<body><main>
<h1>Crompton Homepage Redesign</h1>
