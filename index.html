<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crompton Homepage Redesign — Prototypes</title>
<meta name="description" content="Crompton homepage redesign — interactive desktop and mobile prototypes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    background:#1c3b5c;color:#fff;
    font-family:Poppins,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:24px;text-align:center;
  }
  h1{font-weight:300;font-size:clamp(32px,4.4vw,64px);line-height:1.15;letter-spacing:-.005em}
  p{margin-top:clamp(16px,2vw,28px);font-weight:500;font-size:clamp(15px,1.15vw,17px);color:rgba(255,255,255,.72)}
  .btns{margin-top:clamp(36px,3.8vw,56px);display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
  a{
    display:inline-flex;align-items:center;justify-content:center;
    height:50px;padding:0 28px;border-radius:999px;
    font-weight:500;font-size:16px;text-decoration:none;
    border:1.5px solid #fff;
    transition:transform .3s cubic-bezier(.22,1,.36,1),background-color .3s,color .3s,box-shadow .3s;
  }
  a:hover{transform:translateY(-2px);box-shadow:0 10px 24px -10px rgba(0,0,0,.45)}
  a:active{transform:scale(.98)}
  a:focus-visible{outline:3px solid #7fb0ff;outline-offset:3px}
  .solid{background:#fff;color:#1c3b5c}
  .ghost{background:transparent;color:#fff}
  .ghost:hover{background:rgba(255,255,255,.1)}
  @media (prefers-reduced-motion:reduce){a{transition:none}a:hover{transform:none}}
</style>
</head>
<body>
  <main>
    <h1>Crompton Homepage Redesign</h1>
    <p>Interactive prototypes</p>
    <div class="btns">
      <a class="solid" href="desktop.html">Desktop prototype</a>
      <a class="ghost" href="mobile.html">Mobile prototype</a>
    </div>
  </main>
</body>
</html>
